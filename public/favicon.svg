<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <style>
    #light-icon { display: inline; }
    #dark-icon { display: none; }
    @media (prefers-color-scheme: dark) {
      #light-icon { display: none; }
      #dark-icon { display: inline; }
    }
  </style>
  <g id="light-icon">
    <rect width="128" height="128" rx="28" fill="#0a0a0a"/>
    <text x="64" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-4">JL</text>
  </g>
  <g id="dark-icon">
    <rect width="128" height="128" rx="28" fill="#fafafa"/>
    <text x="64" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#0a0a0a" text-anchor="middle" letter-spacing="-4">JL</text>
  </g>
</svg>
